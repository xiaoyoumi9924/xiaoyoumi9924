<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Xiaoyoumi profile banner</title>
  <desc id="desc">An original anime-inspired night sky illustration in violet and blue, with a small character portrait on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11152f"/>
      <stop offset=".55" stop-color="#282052"/>
      <stop offset="1" stop-color="#142d50"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".85"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".45" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1dc"/>
      <stop offset="1" stop-color="#f2b8c6"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="935" cy="150" r="150" fill="#818cf8" opacity=".16" filter="url(#blur)"/>
  <circle cx="1080" cy="35" r="110" fill="#38bdf8" opacity=".13" filter="url(#blur)"/>
  <path d="M0 290 C180 230 280 370 480 300 S800 240 1200 300 V360 H0Z" fill="#0b1026" opacity=".45"/>
  <g fill="#fff">
    <circle cx="85" cy="58" r="2"/><circle cx="160" cy="115" r="1.5"/><circle cx="275" cy="48" r="2"/>
    <circle cx="380" cy="100" r="1.5"/><circle cx="520" cy="44" r="2"/><circle cx="650" cy="85" r="1.5"/>
    <circle cx="750" cy="35" r="2"/><circle cx="835" cy="95" r="1.5"/><circle cx="1120" cy="95" r="2"/>
    <circle cx="1040" cy="250" r="1.5"/><circle cx="690" cy="270" r="1.5"/><circle cx="450" cy="245" r="2"/>
  </g>
  <g stroke="#c4b5fd" stroke-width="2" opacity=".65" fill="none">
    <path d="M92 175v18m-9-9h18"/><path d="M650 180v14m-7-7h14"/><path d="M770 120v18m-9-9h18"/>
    <path d="M350 205l10 10m0-10-10 10"/>
  </g>
  <circle cx="760" cy="180" r="122" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity=".8"/>
  <circle cx="760" cy="180" r="142" fill="none" stroke="#a5b4fc" stroke-dasharray="3 11" opacity=".4"/>
  <g transform="translate(805 24)">
    <!-- shoulders and collar -->
    <path d="M45 310 Q58 245 110 230 Q165 210 220 236 Q272 260 286 336 H24Z" fill="url(#coat)" stroke="#c7d2fe" stroke-width="2"/>
    <path d="M116 232l38 48 40-48-19-16h-40Z" fill="#f8fafc"/>
    <path d="M143 276l12 26 13-26-13-13Z" fill="#8b5cf6"/>
    <!-- hair behind -->
    <path d="M76 105 Q62 35 145 19 Q245 2 269 91 Q292 163 260 257 Q235 294 216 270 L205 165Z" fill="#3346a8" stroke="#a5b4fc" stroke-width="2"/>
    <path d="M85 108 Q55 150 72 226 Q84 268 107 278 L123 165Z" fill="#5264c8"/>
    <!-- face -->
    <path d="M105 88 Q115 48 164 49 Q218 49 230 100 L220 183 Q210 226 165 238 Q120 225 108 181Z" fill="url(#skin)" stroke="#fbcfe8" stroke-width="2"/>
    <!-- ears -->
    <ellipse cx="103" cy="151" rx="13" ry="22" fill="#f3c0ca"/>
    <ellipse cx="228" cy="151" rx="12" ry="21" fill="#f3c0ca"/>
    <!-- bangs -->
    <path d="M79 132 Q62 61 122 39 Q168 10 220 43 Q264 70 244 143 Q224 119 210 92 Q192 122 170 130 Q164 102 159 88 Q139 124 111 139 L108 111Z" fill="url(#hair)" stroke="#c4b5fd" stroke-width="2"/>
    <path d="M111 83 Q132 43 169 39" fill="none" stroke="#e0e7ff" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    <path d="M196 54 Q231 72 236 105" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    <!-- eyes -->
    <path d="M119 151q15-14 31 0" fill="none" stroke="#43345f" stroke-width="4" stroke-linecap="round"/>
    <path d="M179 151q15-14 31 0" fill="none" stroke="#43345f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="135" cy="157" rx="5" ry="8" fill="#312e81"/>
    <ellipse cx="195" cy="157" rx="5" ry="8" fill="#312e81"/>
    <circle cx="137" cy="154" r="2" fill="#fff"/><circle cx="197" cy="154" r="2" fill="#fff"/>
    <path d="M159 164l-3 12" stroke="#d18a9a" stroke-width="2" stroke-linecap="round"/>
    <path d="M148 194q13 10 26 0" fill="none" stroke="#b45f7a" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="121" cy="183" rx="12" ry="6" fill="#fda4af" opacity=".35"/>
    <ellipse cx="207" cy="183" rx="12" ry="6" fill="#fda4af" opacity=".35"/>
    <!-- hair side strands -->
    <path d="M83 117 Q58 184 89 252 Q105 273 119 251 Q102 194 111 145Z" fill="#6475dc"/>
    <path d="M232 111 Q259 177 235 246 Q222 267 207 250 Q226 188 215 139Z" fill="#4659c4"/>
    <path d="M93 265q-9 22-2 40" stroke="#a5b4fc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M228 260q11 18 5 39" stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="76" y="142" fill="#c4b5fd" font-size="17" letter-spacing="5" font-weight="700">WELCOME TO MY GITHUB</text>
    <text x="72" y="207" fill="#fff" font-size="54" font-weight="800" letter-spacing="1">XIAOYOUMI</text>
    <text x="77" y="246" fill="#cbd5e1" font-size="19" letter-spacing="2">BUILD · LEARN · CREATE</text>
    <rect x="76" y="275" width="228" height="3" rx="2" fill="url(#glow)"/>
    <text x="320" y="284" fill="#a5b4fc" font-size="13" letter-spacing="2">AI / SOFTWARE / SYSTEMS</text>
  </g>
</svg>